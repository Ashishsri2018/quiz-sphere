<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QuizSphere - Infinite trivia game">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <title>QuizSphere - Infinite Trivia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/animations.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
    <noscript>
        <div style="padding: 1rem; text-align: center; background: #ff5252; color: #fff;">
            Please enable JavaScript to play QuizSphere.
        </div>
    </noscript>
    <div id="app">
        <header>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <h1>🧠 QuizSphere</h1>
                <button id="btn-open-settings" class="icon-btn" title="API Keys Manager" aria-label="Manage API Keys">⚙️</button>
            </div>
            <div class="score-display">
                <div class="score-correct">✅ <span id="val-correct">0</span></div>
                <div class="score-wrong">❌ <span id="val-wrong">0</span></div>
            </div>
        </header>

        <dialog id="api-key-modal" class="modal">
            <div class="modal-content card">
                <h2>🔑 API Keys Manager</h2>
                <p class="modal-desc">Manage your free-tier API keys for external providers.</p>
                
                <div class="form-group">
                    <label for="modal-provider-select" class="settings-label">Select Provider</label>
                    <div class="select-wrap" style="margin-top: 0.25rem;">
                        <select id="modal-provider-select" class="settings-select" style="width: 100%;">
                            <option value="quizapi_key">QuizAPI.io (Tech)</option>
                            <option value="apininjas_key">API Ninjas</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 1rem;">
                    <label for="modal-api-key" class="settings-label">API Key</label>
                    <input type="text" id="modal-api-key" placeholder="Enter your key here..." class="modal-input" autocomplete="off" />
                </div>

                <div class="modal-actions" style="margin-top: 1.5rem; display: flex; gap: 1rem; justify-content: flex-end;">
                    <button id="modal-btn-cancel" class="btn-answer">Cancel</button>
                    <button id="modal-btn-save" class="btn-answer" style="background: var(--accent-highlight); color: #fff; border-color: var(--accent-highlight);">Save Key</button>
                </div>
            </div>
        </dialog>

        <div class="settings-bar" id="settings-bar">
            <!-- Rendered via JS -->
        </div>

        <main class="card" id="quiz-card" aria-live="polite">
            <!-- Content rendered via renderer.js -->
            <div class="meta-info skeleton skeleton-text" style="width: 50%;"></div>
            <div class="question-text skeleton skeleton-text" style="height: 3rem; margin-bottom: 1.5rem;"></div>
            
            <div class="answers-grid">
                <div class="skeleton skeleton-btn"></div>
                <div class="skeleton skeleton-btn"></div>
                <div class="skeleton skeleton-btn"></div>
                <div class="skeleton skeleton-btn"></div>
            </div>
        </main>

        <footer class="stats-footer">
            <div id="stat-streak">🔥 Streak: 0</div>
            <div id="stat-best">🏆 Best: 0</div>
            <div id="stat-acc">🎯 Accuracy: 0%</div>
        </footer>
    </div>

    <!-- Main Entry Point -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
