<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QuizSphere - Infinite trivia game">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <title>QuizSphere - Infinite Trivia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/variables.css?v=3">
    <link rel="stylesheet" href="./css/base.css?v=3">
    <link rel="stylesheet" href="./css/components.css?v=5">
    <link rel="stylesheet" href="./css/animations.css?v=3">
    <link rel="stylesheet" href="./css/responsive.css?v=3">
</head>
<body>
    <noscript>
        <div style="padding: 1rem; text-align: center; background: #ff5252; color: #fff;">
            Please enable JavaScript to play QuizSphere.
        </div>
    </noscript>
    <div id="app">
        <header>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <h1>🧠 QuizSphere</h1>
            </div>
            <div class="header-actions">
                <button id="btn-theme-toggle" class="icon-btn" title="Change Theme" aria-label="Change Theme">🎨</button>
                <button id="btn-open-settings" class="icon-btn" title="Settings" aria-label="Settings">⚙️</button>
            </div>
        </header>


        <dialog id="settings-dialog" class="modal">
            <div class="modal-content card settings-dialog-content">
                <!-- Rendered via JS -->
            </div>
        </dialog>

        <div class="settings-bar" id="settings-bar">
            <!-- Rendered via JS -->
        </div>

        <main class="card" id="quiz-card" aria-live="polite">
            <!-- Content rendered via renderer.js -->
            <div class="meta-info skeleton skeleton-text" style="width: 50%;"></div>
            <div class="question-text skeleton skeleton-text" style="height: 3rem; margin-bottom: 1.5rem;"></div>
            
            <div class="answers-grid">
                <div class="skeleton skeleton-btn"></div>
                <div class="skeleton skeleton-btn"></div>
                <div class="skeleton skeleton-btn"></div>
                <div class="skeleton skeleton-btn"></div>
            </div>
        </main>

        <footer class="stats-footer">
            <div class="score-display">
                <div class="stat-chip score-correct">✅ <span id="val-correct">0</span></div>
                <div class="stat-chip score-wrong">❌ <span id="val-wrong">0</span></div>
            </div>
            <div class="stats-right" style="display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center;">
                <div class="stat-chip" id="stat-streak-chip">🔥 <span id="stat-streak">0</span> <span class="stat-label" style="font-weight:normal;font-size:0.8em;opacity:0.8;">streak</span></div>
                <div class="stat-chip" id="stat-best-chip" style="display: none;">🏆 <span id="stat-best">0</span></div>
                <div class="stat-chip" id="stat-acc-chip">🎯 <span id="stat-acc">0%</span></div>
            </div>
        </footer>
    </div>

    <!-- Main Entry Point -->
    <script type="module" src="./js/main.js?v=3"></script>
</body>
</html>
